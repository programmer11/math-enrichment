services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: math_assessment
    ports:
      - "5432:5432"
    volumes:
      - math_assessment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d math_assessment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  math_assessment_pgdata:
